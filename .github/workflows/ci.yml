name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zapdetaily
          POSTGRES_USER: zapdetaily
          POSTGRES_PASSWORD: zapdetaily
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zapdetaily -d zapdetaily"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://zapdetaily:zapdetaily@localhost:5432/zapdetaily
      FINANCE_TEST_DATABASE_URL: postgres://zapdetaily:zapdetaily@localhost:5432/zapdetaily
      APP_URL: http://localhost:3000
      NODE_ENV: test
      ZD_PLAN: plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plan: [basic, standard, plus]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zapdetaily
          POSTGRES_USER: zapdetaily
          POSTGRES_PASSWORD: zapdetaily
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zapdetaily -d zapdetaily"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgres://zapdetaily:zapdetaily@localhost:5432/zapdetaily
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:${{ matrix.plan }}
